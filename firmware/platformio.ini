; Firmware cho 3 nút Zone + 1 gateway (xem docs/DESIGN.md §4)

[env]
platform = espressif32 @ ^6.9.0   ; Arduino-ESP32 core 2.0.x
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

[node_common]
build_src_filter = +<node/>
lib_deps =
    adafruit/Adafruit SHT31 Library

[env:node_z1]
extends = node_common
build_flags = -DZONE_ID=1

[env:node_z2]
extends = node_common
build_flags = -DZONE_ID=2

[env:node_z3]
extends = node_common
build_flags = -DZONE_ID=3

[env:gateway]
build_src_filter = +<gateway/>
lib_deps =
    bblanchon/ArduinoJson
