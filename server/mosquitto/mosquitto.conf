# Chạy: "C:\Program Files\mosquitto\mosquitto.exe" -c server\mosquitto\mosquitto.conf -v
# (chạy từ thư mục gốc repo; đường dẫn passwd/acl tương đối theo thư mục hiện tại)
per_listener_settings false
listener 1883 0.0.0.0
allow_anonymous false
password_file server/mosquitto/passwd
acl_file server/mosquitto/acl
persistence false
