# Mosquitto trong Docker (docker-compose.yml). Bản chạy thẳng trên Windows: mosquitto.conf
listener 1883
# MQTT qua WebSocket cho gateway ở mạng khác: cloudflared đưa ra wss://mqtt.<ten-mien> (docs/SERVER.md §14).
# Cùng tài khoản/ACL với 1883 (per_listener_settings mặc định false). Cổng chỉ mở 127.0.0.1 trong compose.
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
